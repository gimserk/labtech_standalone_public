<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5: The Red Team</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Custom styles for the presentation */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        .slide-container {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid #374151; /* border-gray-700 */
            transition: opacity 0.5s ease-in-out;
        }
        /* Simple fade transition for slide content */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Enhanced fullscreen experience */
        body:fullscreen #slide-content {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            border-radius: 0;
            border: none;
        }
        body:fullscreen #navigation-controls {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1280px; /* max-w-7xl */
            z-index: 50;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Slide Container - Increased size for a better view -->
    <div id="slide-content" class="w-full max-w-7xl h-[80vh] rounded-2xl shadow-2xl flex items-center justify-center p-8 slide-container">
        <!-- Slide content will be injected here by JavaScript -->
    </div>

    <!-- Navigation and Progress Bar -->
    <div id="navigation-controls" class="w-full max-w-7xl mt-8">
        <!-- Progress Bar -->
        <div class="w-full bg-gray-700 rounded-full h-2.5 mb-4">
            <div id="progress-bar" class="bg-cyan-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        
        <div class="flex justify-between items-center">
            <!-- Previous Button -->
            <button id="prev-btn" class="flex items-center gap-2 px-6 py-3 bg-gray-800 rounded-lg shadow-md hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Previous
            </button>

            <!-- Controls -->
            <div class="flex items-center gap-4">
                <span id="slide-counter" class="text-gray-400 text-lg">
                    1 / 29
                </span>
                <button id="fullscreen-btn" title="Toggle Fullscreen (F key)" class="p-2 text-gray-400 hover:text-white transition-colors bg-gray-800 rounded-lg shadow-md hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
            </div>

            <!-- Next Button -->
            <button id="next-btn" class="flex items-center gap-2 px-6 py-3 bg-cyan-600 rounded-lg shadow-md hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <script>
        // --- Slide Data ---
        const slides = [
          { type: 'title', title: 'Day 5: The Red Team', subtitle: 'Offensive Security' },
          { type: 'list', title: 'Agenda', items: ['Introduction to Ethical Hacking', 'The Metasploit Framework', 'Understanding Payloads, Stagers, & Shells', 'Web App Vulnerabilities: OWASP Top 10', 'Hands-On Labs'] },
          { type: 'list', title: 'Day 5 Introduction', items: ['Yesterday, we learned to find vulnerabilities.', 'Today, we learn to **exploit** them.', 'You are now the **Red Team**: your job is to simulate an attacker.', 'We will use the Metasploit Framework to launch our first ethical hacks.'] },
          { type: 'title', title: 'Ethical Hacking', subtitle: 'Hacking for a Good Cause' },
          { type: 'list', title: 'What is Ethical Hacking?', items: ['Also known as **penetration testing** or "white-hat" hacking.', 'The **authorized** practice of finding and fixing security vulnerabilities.', 'Core Principle: To beat an attacker, you must think like one.'] },
          { type: 'list', title: 'The Golden Rules', items: ['**1. Get Permission:** You MUST have explicit, written authorization before starting any test.', '**2. Respect the Scope:** The contract defines what you can and cannot test. Stay within the boundaries.', 'Hacking without permission is a crime, regardless of intent.'] },
          { type: 'list', title: 'Why Do It? Proactive Defense', items: ['Find weaknesses before malicious attackers do.', 'Test if security controls (like firewalls and IDS) actually work.', 'Identify complex attack chains that automated scanners miss.', 'Provide a clear report on how to fix the vulnerabilities.'] },
          { type: 'title', title: 'The Metasploit Framework', subtitle: 'The Ethical Hacker\'s Toolkit' },
          { type: 'list', title: 'What is Metasploit?', items: ['An open-source platform for developing and executing exploit code.', 'It\'s a massive, weaponized library of exploits and payloads.', 'Automates the process of attacking a system, making it highly efficient.'] },
          { type: 'list', title: 'Core Components: Exploit', items: ['An **exploit** is the piece of code that takes advantage of a specific vulnerability.', 'Metasploit has thousands of exploits for a huge range of systems.', 'The exploit is the "key" that unlocks the door.'] },
          { type: 'list', title: 'Core Components: Payload', items: ['The **payload** is the code that runs *after* the exploit is successful.', 'It\'s the "what" you do after unlocking the door.', 'The primary goal of a payload is to give you remote control.'] },
          { type: 'list', title: 'Core Components: Auxiliary', items: ['**Auxiliary modules** are tools that don\'t deliver a payload.', 'They are used for reconnaissance, scanning, enumeration, and denial-of-service attacks.', 'Example: An auxiliary scanner to check if a system is vulnerable to a specific exploit.'] },
          { type: 'list', title: 'The `msfconsole`', items: ['The `msfconsole` is the primary command-line interface for Metasploit.', 'It allows you to search for, configure, and launch modules.', 'This is where we will spend most of our time.'] },
          { type: 'list', title: 'The Metasploit Workflow', items: ['**1. Search:** Find an exploit for your target.', '**2. Select:** Choose the exploit module (`use exploit/...`).', '**3. Configure:** Set options like `RHOSTS` (target IP).', '**4. Select & Configure Payload:** Choose a payload and set options like `LHOST` (your IP).', '**5. Exploit:** Launch the attack (`exploit` or `run`).'] },
          { type: 'title', title: 'Understanding Payloads, Stagers, & Shells', subtitle: 'Delivering the Weapon' },
          { type: 'list', title: 'What is a Shell?', items: ['The ultimate goal of most attacks.', 'A **shell** is an interface that lets you execute commands on a remote system.', 'Gaining a shell = You have successfully compromised the machine.'] },
          { type: 'comparison', title: 'Bind Shell vs. Reverse Shell', subtitle: '', columns: [{ title: 'Bind Shell', items: ['Opens a listener port **on the target**.', 'Attacker connects **to** the victim.', 'Often blocked by firewalls.'] }, { title: 'Reverse Shell', items: ['The target connects **back to** the attacker.', 'Attacker has a listener waiting.', 'Much more likely to bypass firewalls.'] }] },
          { type: 'list', title: 'Stagers and Stages', items: ['Exploits have size limits. A full payload might be too big.', '**Staged Payload:** A two-part delivery system.', '**Stager:** A tiny piece of code that establishes a connection and downloads the rest.', '**Stage:** The larger, main payload that gets downloaded.'] },
          { type: 'list', title: 'Meterpreter: The Ultimate Payload', items: ['Metasploit\'s advanced, feature-rich payload.', '**Stealthy:** Runs entirely in memory, never touching the hard drive.', '**Encrypted:** All communication is secure.', '**Extensible:** Has its own powerful post-exploitation commands (`hashdump`, `screenshot`, etc.).'] },
          { type: 'title', title: 'Web Application Vulnerabilities', subtitle: 'Introducing OWASP' },
          { type: 'list', title: 'What is OWASP?', items: ['**O**pen **W**eb **A**pplication **S**ecurity **P**roject.', 'A global non-profit organization focused on improving software security.', 'They produce free, unbiased articles, tools, and documentation.'] },
          { type: 'list', title: 'The OWASP Top 10', items: ['OWASP\'s flagship project.', 'A standard awareness document listing the 10 most critical security risks to web applications.', 'It is updated every few years based on extensive data analysis.', 'An essential checklist for any web application penetration test.'] },
          { type: 'title', title: 'Deep Dive: SQL Injection (SQLi)', subtitle: 'A Classic & Devastating Attack' },
          { type: 'list', title: 'What is SQL Injection?', items: ['A code injection technique that targets an application\'s database.', 'Occurs when an application trusts user input and includes it in an SQL query without cleaning it.', 'Allows an attacker to manipulate the database query.'] },
          { type: 'list', title: 'How it Works: The Classic Login Bypass', items: ['Imagine a query: `SELECT * FROM users WHERE username = \'user_input\'`', "An attacker enters: `' OR 1=1 --`", 'The final query becomes: `SELECT * FROM users WHERE username = \'\' OR 1=1 --`', 'Since `1=1` is always true, the database returns all users, and the attacker is logged in.'] },
          { type: 'list', title: 'Impact of SQLi', items: ['**Authentication Bypass:** Log in without a password.', '**Data Theft:** Read sensitive data from any table in the database.', '**Data Modification/Deletion:** Change or destroy information.', '**Remote Code Execution:** In some cases, take full control of the database server.'] },
          { type: 'list', title: 'Lab 1: Metasploit Mayhem', items: ['**Objective:** Use Metasploit to exploit a vulnerable service.', '**Tasks:**', 'Identify a vulnerable service on a target machine.', 'Find the correct exploit in Metasploit.', 'Configure and launch the exploit to gain a Meterpreter shell.'] },
          { type: 'list', title: 'Lab 2: SQL Injection Slinger', items: ['**Objective:** Perform a manual SQL injection attack.', '**Tasks:**', 'Analyze a web application\'s login form.', 'Craft a malicious input string to bypass authentication.', 'Gain access to a protected area of the website.'] },
          { type: 'list', title: 'Day 5 Wrap-Up', items: ['**Review:** Ethical Hacking, Metasploit, Payloads, OWASP, SQLi.', '**Q&A**', '**Preview Day 6:** The Blue Team - Firewalls, IDS, and Logging.'] },
        ];

        let currentSlide = 0;

        // --- DOM Elements ---
        const slideContentEl = document.getElementById('slide-content');
        const progressBarEl = document.getElementById('progress-bar');
        const slideCounterEl = document.getElementById('slide-counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        // --- Helper function to parse markdown-like formatting ---
        function formatText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-cyan-300">$1</strong>')
                .replace(/`(.*?)`/g, '<code class="bg-gray-700 text-yellow-300 rounded px-1.5 py-0.5 font-mono text-sm">$1</code>');
        }

        // --- Function to render the current slide ---
        function renderSlide() {
            const slide = slides[currentSlide];
            let html = '';

            switch (slide.type) {
                case 'title':
                    html = `<div class="text-center fade-in"><h1 class="text-5xl md:text-6xl font-bold text-white mb-4">${slide.title}</h1><p class="text-2xl md:text-3xl text-cyan-400">${slide.subtitle}</p></div>`;
                    break;
                case 'list':
                    html = `<div class="w-full fade-in"><h2 class="text-4xl font-bold text-white mb-8 text-center">${slide.title}</h2><ul class="space-y-4 text-xl text-gray-300 list-disc list-inside max-w-3xl mx-auto">${slide.items.map(item => `<li>${formatText(item)}</li>`).join('')}</ul></div>`;
                    break;
                case 'comparison':
                    html = `<div class="w-full fade-in"><h2 class="text-4xl font-bold text-white mb-2 text-center">${slide.title}</h2><p class="text-xl text-gray-400 mb-8 text-center">${formatText(slide.subtitle)}</p><div class="grid md:grid-cols-2 gap-8 w-full">${slide.columns.map(col => `<div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-2xl font-semibold text-cyan-400 mb-4">${col.title}</h3><ul class="space-y-3 text-lg text-gray-300 list-disc list-inside">${col.items.map(item => `<li>${formatText(item)}</li>`).join('')}</ul></div>`).join('')}</div></div>`;
                    break;
                default:
                    html = `<div class="text-center fade-in"><h2 class="text-2xl text-red-400">Error: Unknown slide type.</h2></div>`;
            }
            slideContentEl.innerHTML = html;
        }

        // --- Function to update the entire UI state ---
        function updateUI() {
            renderSlide();
            
            const progress = ((currentSlide + 1) / slides.length) * 100;
            progressBarEl.style.width = `${progress}%`;
            slideCounterEl.textContent = `${currentSlide + 1} / ${slides.length}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
        }
        
        // --- Fullscreen Toggle Function ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- Event Listeners ---
        prevBtn.addEventListener('click', () => {
            if (currentSlide > 0) {
                currentSlide--;
                updateUI();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateUI();
            }
        });
        
        fullscreenBtn.addEventListener('click', toggleFullScreen);
        
        // --- Keyboard Navigation ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextBtn.click();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevBtn.click();
            } else if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullScreen();
            }
        });

        // --- Initial Render ---
        document.addEventListener('DOMContentLoaded', updateUI);

    </script>
</body>
</html>
