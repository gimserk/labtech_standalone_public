<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4: Active Recon & Scanning</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for a clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Custom styles for the presentation */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* bg-gray-900 */
        }
        .slide-container {
            background-color: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            border: 1px solid #374151; /* border-gray-700 */
            transition: opacity 0.5s ease-in-out;
        }
        /* Simple fade transition for slide content */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        /* Enhanced fullscreen experience */
        body:fullscreen #slide-content {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            border-radius: 0;
            border: none;
        }
        body:fullscreen #navigation-controls {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1280px; /* max-w-7xl */
            z-index: 50;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Slide Container - Increased size for a better view -->
    <div id="slide-content" class="w-full max-w-7xl h-[80vh] rounded-2xl shadow-2xl flex items-center justify-center p-8 slide-container">
        <!-- Slide content will be injected here by JavaScript -->
    </div>

    <!-- Navigation and Progress Bar -->
    <div id="navigation-controls" class="w-full max-w-7xl mt-8">
        <!-- Progress Bar -->
        <div class="w-full bg-gray-700 rounded-full h-2.5 mb-4">
            <div id="progress-bar" class="bg-cyan-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        
        <div class="flex justify-between items-center">
            <!-- Previous Button -->
            <button id="prev-btn" class="flex items-center gap-2 px-6 py-3 bg-gray-800 rounded-lg shadow-md hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                Previous
            </button>

            <!-- Controls -->
            <div class="flex items-center gap-4">
                <span id="slide-counter" class="text-gray-400 text-lg">
                    1 / 41
                </span>
                <button id="fullscreen-btn" title="Toggle Fullscreen (F key)" class="p-2 text-gray-400 hover:text-white transition-colors bg-gray-800 rounded-lg shadow-md hover:bg-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
            </div>

            <!-- Next Button -->
            <button id="next-btn" class="flex items-center gap-2 px-6 py-3 bg-cyan-600 rounded-lg shadow-md hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </button>
        </div>
    </div>

    <script>
        // --- Slide Data ---
        const slides = [
          { type: 'title', title: 'Day 4: Active Recon & Scanning', subtitle: 'Rattling the Doorknobs' },
          { type: 'list', title: 'Agenda', items: ['Network Scanning & Enumeration', 'Nmap Deep Dive', 'Vulnerability Management', 'Frameworks: CVE, CVSS, & ATT&CK', 'Labs & Group Activity'] },
          { type: 'list', title: 'Day 4 Introduction', items: ['Yesterday, we learned the "why" of attacks.', 'Today, we learn the "how" of **active reconnaissance**.', 'We move from passively observing to actively probing the target.', 'This is where we build the map an attacker uses to find a way in.'] },
          { type: 'title', title: 'Network Scanning & Enumeration', subtitle: 'Building the Map & Getting the Details' },
          { type: 'list', title: 'Scanning vs. Reconnaissance', items: ['**Passive Reconnaissance (Day 3):** Gathering info without touching the target (e.g., OSINT). It\'s stealthy.', '**Active Scanning (Today):** Directly interacting with the target network. Sends packets, gets responses. It\'s noisy but provides accurate data.'] },
          { type: 'list', title: 'The Goals of Scanning', items: ['**1. Host Discovery:** What devices are online?', '**2. Port Scanning:** What services are they running?', '**3. OS & Service Fingerprinting:** What specific software versions are they using?'] },
          { type: 'list', title: 'What is Enumeration?', items: ['If scanning builds the map, enumeration adds the labels.', 'It\'s the process of using active connections to extract specific details from services.', 'Examples: Usernames, machine names, network shares, password policies.'] },
          { type: 'title', title: 'Nmap Deep Dive', subtitle: 'The Swiss Army Knife of Networking' },
          { type: 'list', title: 'Nmap: The King of Scanners', items: ['**N**etwork **Map**per is the industry-standard tool.', 'It\'s a powerful and versatile command-line scanner.', 'Can perform host discovery, port scanning, version detection, OS fingerprinting, and more.'] },
          { type: 'list', title: 'Nmap: Host Discovery', items: ['**Command:** `nmap -sn <target>`', 'The `-sn` flag tells Nmap to perform a "ping scan".', 'It discovers which hosts are online but does **not** perform a port scan.', 'This is always the first step on a network.'] },
          { type: 'list', title: 'Nmap: Port Scanning', items: ['**Basic Scan:** `nmap <target>` (scans top 1000 TCP ports).', '**Scan All Ports:** `nmap -p- <target>`', '**Scan Specific Ports:** `nmap -p 22,80,443 <target>`', '**Fast Scan:** `nmap -F <target>` (scans top 100 ports).'] },
          { type: 'list', title: 'Nmap: Stealth Scans', items: ['Used to evade simple firewalls and logging.', '**SYN Scan (-sS):** The default stealth scan. Never completes the TCP handshake.', '**FIN Scan (-sF):** Sends a packet with only the FIN flag set.', '**Xmas Scan (-sX):** Sends a packet with FIN, PSH, and URG flags set.', '**Null Scan (-sN):** Sends a packet with no flags set.'] },
          { type: 'list', title: 'Nmap: Service & OS Detection', items: ['**Service Version Detection:** `nmap -sV <target>`', 'Probes open ports to find out what software version is running. Crucial for finding exploits.', '**OS Detection:** `nmap -O <target>`', 'Analyzes responses to guess the operating system. Requires root/admin privileges.'] },
          { type: 'list', title: 'Nmap: The Nmap Scripting Engine (NSE)', items: ['The most powerful feature of Nmap.', 'Allows Nmap to run small scripts to perform advanced tasks.', 'Tasks include advanced vulnerability detection, enumeration, and even brute-forcing.'] },
          { type: 'list', title: 'Nmap: Using NSE', items: ['**Activate a script:** `--script <script-name>`', '**Activate a category of scripts:** `--script=<category>`', 'Example: `nmap --script vuln <target>` runs all scripts in the "vuln" category.', 'Example: `nmap --script http-title <target>` gets the title of webpages.'] },
          { type: 'list', title: 'Nmap: The Aggressive Scan', items: ['**Command:** `nmap -A <target>`', 'A convenient shortcut for a comprehensive scan.', 'Enables OS detection (`-O`), version detection (`-sV`), script scanning (`-sC`), and traceroute.'] },
          { type: 'title', title: 'Vulnerability Management', subtitle: 'From Discovery to Remediation' },
          { type: 'list', title: 'What is Vulnerability Scanning?', items: ['An automated process to identify known security weaknesses.', 'It takes the results of a network scan and compares them against a database of vulnerabilities.', 'The goal is to find flaws before an attacker does.'] },
          { type: 'list', title: 'Framework: CVE', items: ['**C**ommon **V**ulnerabilities and **E**xposures.', 'A dictionary of publicly known security flaws.', 'Each vulnerability gets a unique ID (e.g., `CVE-2017-0144`).', 'Provides a standard name for everyone to use.'] },
          { type: 'list', title: 'Framework: CVSS', items: ['**C**ommon **V**ulnerability **S**coring **S**ystem.', 'A standard for rating the severity of a vulnerability.', 'Produces a score from 0.0 (None) to 10.0 (Critical).', 'Helps teams prioritize which vulnerabilities to fix first.'] },
          { type: 'list', title: 'CVSS Base Score Metrics (Exploitability)', items: ['**Attack Vector (AV):** Network, Adjacent, Local, Physical?', '**Attack Complexity (AC):** Low or High?', '**Privileges Required (PR):** None, Low, or High?', '**User Interaction (UI):** None or Required?'] },
          { type: 'list', title: 'CVSS Base Score Metrics (Impact)', items: ['**Confidentiality (C):** How much data could be exposed? (High, Low, None)', '**Integrity (I):** How much can data be modified? (High, Low, None)', '**Availability (A):** How much can the service be disrupted? (High, Low, None)'] },
          { type: 'list', title: 'Framework: MITRE ATT&CK', items: ['A global knowledge base of **adversary behavior**.', 'Focuses on *how* attackers operate, not just what they exploit.', 'Organized into Tactics, Techniques, and Procedures (TTPs).'] },
          { type: 'list', title: 'ATT&CK: Tactics, Techniques, Procedures', items: ['**Tactics:** The adversary\'s high-level goal (e.g., `Initial Access`, `Credential Access`).', '**Techniques:** How the goal is achieved (e.g., `Phishing`, `OS Credential Dumping`).', '**Procedures:** The specific implementation of a technique by a threat group.'] },
          { type: 'list', title: 'The Vulnerability Management Lifecycle', items: ['A continuous professional workflow:', '**1. Discovery:** Scan systems to find vulnerabilities.', '**2. Prioritization:** Analyze reports and CVSS scores to decide what to fix first.', '**3. Remediation:** Apply patches or hardening (Change Control is key!).', '**4. Verification:** Scan again to confirm the vulnerability is gone.'] },
          { type: 'list', title: 'Vulnerability Mitigation Strategies', items: ['**Patch Management:** Applying vendor-supplied updates. The most common fix.', '**Secure Configuration (Hardening):** Disabling unused services, changing default passwords.', '**Compensating Controls:** Using a tool like a WAF to protect an un-patchable system.', '**Risk Acceptance:** A formal business decision to accept the risk of a low-impact flaw.'] },
          { type: 'list', title: 'Key Vulnerability Scanners', items: ['**Nessus:** The commercial industry leader, developed by Tenable. Known for its user-friendly interface and extensive plugin database.', '**OpenVAS:** The premier open-source vulnerability scanner. Powerful and free, maintained by Greenbone Networks.'] },
          { type: 'list', title: 'Lab 1: Nmap Ninja - Mastering the Manual', items: ['**Objective:** Learn to find and use Nmap\'s options from its help menus.', '**Tasks:** Use `nmap -h` and `man nmap` to answer questions about switches.', 'Teaches you how to learn, not just what to type.'] },
          { type: 'list', title: 'Lab 2: Advanced Nmap Techniques', items: ['**Objective:** Use stealth scans and the Nmap Scripting Engine (NSE).', '**Tasks:**', 'Run a FIN scan against a target.', 'Use the `http-title` and `smb-os-discovery` scripts to gather intelligence.'] },
          { type: 'list', title: 'Group Activity: Pen Test Plan', items: ['**Objective:** Work in a team to create a high-level scanning plan.', '**Scenario:** You are hired to test a small office network.', '**Task:** Whiteboard the first 3-4 steps of your scanning and enumeration workflow.'] },
          { type: 'list', title: 'Lab 3: Vulnerability Voyage', items: ['**Objective:** Use Nessus to find flaws in a target system.', '**Tasks:**', 'Configure and launch a Nessus scan against a vulnerable VM.', 'Analyze the generated report and identify critical vulnerabilities.'] },
          { type: 'list', title: 'Day 4 Wrap-Up', items: ['**Review:** Scanning, Enumeration, Nmap, Vulnerability Management.', '**Q&A**', '**Preview Day 5:** The Red Team - Exploitation with Metasploit.'] },
        ];

        let currentSlide = 0;

        // --- DOM Elements ---
        const slideContentEl = document.getElementById('slide-content');
        const progressBarEl = document.getElementById('progress-bar');
        const slideCounterEl = document.getElementById('slide-counter');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        // --- Helper function to parse markdown-like formatting ---
        function formatText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-cyan-300">$1</strong>')
                .replace(/`(.*?)`/g, '<code class="bg-gray-700 text-yellow-300 rounded px-1.5 py-0.5 font-mono text-sm">$1</code>');
        }

        // --- Function to render the current slide ---
        function renderSlide() {
            const slide = slides[currentSlide];
            let html = '';

            switch (slide.type) {
                case 'title':
                    html = `<div class="text-center fade-in"><h1 class="text-5xl md:text-6xl font-bold text-white mb-4">${slide.title}</h1><p class="text-2xl md:text-3xl text-cyan-400">${slide.subtitle}</p></div>`;
                    break;
                case 'list':
                    html = `<div class="w-full fade-in"><h2 class="text-4xl font-bold text-white mb-8 text-center">${slide.title}</h2><ul class="space-y-4 text-xl text-gray-300 list-disc list-inside max-w-3xl mx-auto">${slide.items.map(item => `<li>${formatText(item)}</li>`).join('')}</ul></div>`;
                    break;
                case 'comparison':
                    html = `<div class="w-full fade-in"><h2 class="text-4xl font-bold text-white mb-2 text-center">${slide.title}</h2><p class="text-xl text-gray-400 mb-8 text-center">${formatText(slide.subtitle)}</p><div class="grid md:grid-cols-2 gap-8 w-full">${slide.columns.map(col => `<div class="bg-gray-800 p-6 rounded-lg"><h3 class="text-2xl font-semibold text-cyan-400 mb-4">${col.title}</h3><ul class="space-y-3 text-lg text-gray-300 list-disc list-inside">${col.items.map(item => `<li>${formatText(item)}</li>`).join('')}</ul></div>`).join('')}</div></div>`;
                    break;
            }
            slideContentEl.innerHTML = html;
        }

        // --- Function to update the entire UI state ---
        function updateUI() {
            renderSlide();
            
            const progress = ((currentSlide + 1) / slides.length) * 100;
            progressBarEl.style.width = `${progress}%`;
            slideCounterEl.textContent = `${currentSlide + 1} / ${slides.length}`;
            prevBtn.disabled = currentSlide === 0;
            nextBtn.disabled = currentSlide === slides.length - 1;
        }
        
        // --- Fullscreen Toggle Function ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // --- Event Listeners ---
        prevBtn.addEventListener('click', () => {
            if (currentSlide > 0) {
                currentSlide--;
                updateUI();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                updateUI();
            }
        });
        
        fullscreenBtn.addEventListener('click', toggleFullScreen);
        
        // --- Keyboard Navigation ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextBtn.click();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevBtn.click();
            } else if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullScreen();
            }
        });

        // --- Initial Render ---
        document.addEventListener('DOMContentLoaded', updateUI);

    </script>
</body>
</html>
