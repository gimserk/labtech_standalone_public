{% load static %}
{% load account %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LabTech Platform{% endblock %}</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        :root {
            /* Consistent Site-Wide Theme */
            --primary-color: #3B82F6;
            --primary-hover: #2563EB;
            --light-bg: #f8fafc;
            --dark-bg: #0f172a;
            --dark-surface: #1e293b; /* For cards, footers, etc. */
            --dark-border: #334155;
            --text-light: #f1f5f9;
            --text-dark: #0f172a;
            --text-muted-light: #64748b;
            --text-muted-dark: #94a3b8;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg); 
            color: var(--text-dark);
            margin: 0;
        }
        
        /* --- Main Navigation Bar --- */
        .main-nav {
            background-color: var(--dark-surface);
            padding: 1rem 0;
            border-bottom: 1px solid var(--dark-border);
        }
        .nav-container { max-width: 1400px; }
        
        a.nav-logo {
            color: var(--text-light);
            text-decoration: none;
            font-size: 1.8rem;
            font-weight: 800;
            transition: color 0.2s ease;
        }
        a.nav-logo:hover {
            color: #fff;
            text-decoration: none;
        }
        .nav-links a { color: var(--text-muted-dark); text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--text-light); }
        .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); border-color: var(--primary-hover); }
        .btn-outline-light { border-color: var(--text-muted-dark); color: var(--text-muted-dark); }
        .btn-outline-light:hover { border-color: var(--text-light); color: var(--text-light); background-color: rgba(255,255,255,0.1); }

        /* --- Footer --- */
        .site-footer {
            background-color: var(--dark-surface);
            color: var(--text-muted-dark);
            padding: 4rem 0 2rem 0;
            font-size: 0.9rem;
        }
        .site-footer h5 { color: var(--text-light); font-weight: 600; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; font-size: 1rem; }
        .site-footer a { color: var(--text-muted-dark); text-decoration: none; transition: color 0.2s ease; }
        .site-footer a:hover { color: var(--text-light); text-decoration: underline; }
        .footer-bottom { border-top: 1px solid var(--dark-border); padding-top: 2rem; margin-top: 2rem; }
        .social-icons a { color: var(--text-muted-dark); font-size: 1.25rem; margin-left: 1.5rem; }

        /* --- Django Messages --- */
        .messages { list-style: none; padding: 0; margin: 1.5rem auto; max-width: 1400px; }
        .messages li { padding: 1rem; margin-bottom: 1rem; border: 1px solid transparent; border-radius: 0.375rem; }
        .messages li.success { color: #0f5132; background-color: #d1e7dd; border-color: #badbcc; }
        .messages li.error { color: #842029; background-color: #f8d7da; border-color: #f5c6cb; }
        .messages li.info { color: #055160; background-color: #cff4fc; border-color: #b6effb; }
        .messages li.warning { color: #664d03; background-color: #fff3cd; border-color: #ffecb5; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
  
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    {% block extra_body %}{% endblock %}
</body>
</html>
