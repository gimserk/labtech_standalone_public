{% extends "labtech/generic_base.html" %}
{% load static %}
{% load crispy_forms_tags %}  {% block labtech_title %}{{ title }}{% endblock %}

{% block labtech_content %}
<div class="breadcrumb-nav" style="margin-bottom: 20px; font-size: 0.9rem;">
    <a href="{% url 'cybercity_dashboard' %}">CyberCity Dashboard</a> &raquo;
    <a href="{% url 'cybercity_detail' city.id %}">{{ city.name }}</a> &raquo;
    <a href="{% url 'cybercity_manage_feeds' city.id %}">Manage Feeds</a> &raquo;
    <span>Edit</span>
</div>

<h1>{{ title }}</h1>

<form method="post" novalidate>
    {% csrf_token %}
    {{ form|crispy }}  <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{% url 'cybercity_manage_feeds' city.id %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
