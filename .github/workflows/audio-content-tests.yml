name: Audio course content tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'scripts/render_audio_player.py'
      - 'scripts/test_audio_player.cjs'
      - 'scripts/theme-tests/**'
      - '.github/workflows/audio-content-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'scripts/render_audio_player.py'
      - 'scripts/test_audio_player.cjs'
      - 'scripts/theme-tests/**'
      - '.github/workflows/audio-content-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-django:
    name: Audio upload, delivery & package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libffi-dev
      - name: Install pinned application dependencies
        run: python -m pip install -r requirements.txt
      - name: Test M4A uploads, private playback, editing and course completion
        run: python manage.py test app.test_audio --settings=app.test_settings -v 2
      - name: Test audio course-package export/import
        run: python manage.py test app.test_course_packages --settings=app.test_settings -v 1
      - name: Django configuration and migration consistency
        run: |
          python manage.py check --settings=app.test_settings
          python manage.py makemigrations --check --dry-run --settings=app.test_settings

  audio-browser:
    name: Audio browser playback & accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libffi-dev
          python -m pip install -r requirements.txt
          npm ci --prefix scripts/theme-tests --ignore-scripts
          scripts/theme-tests/node_modules/.bin/playwright-core install --with-deps chromium
      - name: Render authenticated upload and external audio student pages
        run: python scripts/render_audio_player.py /tmp/labtech-audio-player.json
      - name: Test browser play, seek, retry, mobile layout and a11y
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/theme-tests/node_modules
        run: node scripts/test_audio_player.cjs /tmp/labtech-audio-player.json /tmp/audio-player-results
      - name: Upload audio test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audio-browser-failure-screenshots
          path: /tmp/audio-player-results
          if-no-files-found: ignore
