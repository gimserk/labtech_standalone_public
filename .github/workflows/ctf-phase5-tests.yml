name: CTF Phase 5 — AI Challenge Drafts

on:
  pull_request:
    paths:
      - 'app/models.py'
      - 'app/ctf_bank.py'
      - 'app/ctf_ai_generation.py'
      - 'app/urls.py'
      - 'app/templates/labtech/ctf_ai_challenge_draft.html'
      - 'app/templates/labtech/ctf_bank.html'
      - 'app/migrations/0078_ctf_template_artifact_solution.py'
      - 'app/test_ctf_phase5.py'
      - '.github/workflows/ctf-phase5-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/ctf_ai_generation.py'
      - 'app/test_ctf_phase5.py'
permissions:
  contents: read
jobs:
  ai-ctf-drafts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libffi-dev
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Compile changed modules
        run: python -m py_compile app/models.py app/ctf_bank.py app/ctf_ai_generation.py app/urls.py app/test_ctf_phase5.py app/migrations/0078_ctf_template_artifact_solution.py
      - name: AI challenge and CTF regressions
        run: python manage.py test app.test_ctf_phase5 app.test_ctf_phase4c app.test_ctf_phase4b app.test_ctf_phase4a app.test_ctf_phase3b app.test_ctf_phase3 app.test_ctf_phase2 app.test_ctf2 --settings=app.test_settings -v 2
