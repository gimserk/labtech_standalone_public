name: CTF Phase 3B — Challenge Bank

on:
  pull_request:
    paths:
      - 'app/models.py'
      - 'app/migrations/0074_ctf_challenge_bank.py'
      - 'app/ctf_bank.py'
      - 'app/urls.py'
      - 'app/templates/labtech/ctf_bank*.html'
      - 'app/templates/labtech/ctf_manage.html'
      - 'app/templates/labtech/ctf_dashboard.html'
      - 'app/test_ctf_phase3b.py'
      - '.github/workflows/ctf-phase3b-tests.yml'
  push:
    branches: [main]
    paths:
      - 'app/ctf_bank.py'
      - 'app/test_ctf_phase3b.py'

permissions:
  contents: read

jobs:
  challenge-bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt1-dev libjpeg-dev zlib1g-dev libffi-dev
      - name: Install application
        run: python -m pip install -r requirements.txt
      - name: Compile touched code
        run: python -m py_compile app/ctf_bank.py app/models.py app/urls.py app/test_ctf_phase3b.py app/migrations/0074_ctf_challenge_bank.py
      - name: CTF bank and previous CTF tests
        run: python manage.py test app.test_ctf_phase3b app.test_ctf_phase3 app.test_ctf_phase2 app.test_ctf2 --settings=app.test_settings -v 2
