name: Cyber City ESP32 firmware tests
on:
  pull_request:
    paths:
      - 'firmware/cybercity/esp32/**'
      - 'firmware/cybercity/tools/**'
      - 'app/cybercity_firmware_bundle.py'
      - '.github/workflows/cybercity-esp32-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/cybercity/esp32/**'
      - 'firmware/cybercity/tools/**'
      - 'app/cybercity_firmware_bundle.py'
      - '.github/workflows/cybercity-esp32-tests.yml'
jobs:
  host_regressions:
    name: ESP32 host-side HTTPS and USB installer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check firmware Python syntax
        run: |
          python -m py_compile firmware/cybercity/esp32/labtech_https.py firmware/cybercity/tools/usb_install.py firmware/cybercity/tools/test_labtech_https.py firmware/cybercity/tools/test_usb_install.py app/cybercity_firmware_bundle.py
      - name: Test HTTPS transport and USB installation plan
        run: |
          python -m unittest discover -s firmware/cybercity/tools -p 'test_labtech_https.py' -v
          python -m unittest discover -s firmware/cybercity/tools -p 'test_usb_install.py' -v
          python -m unittest discover -s firmware/cybercity/tools -p 'test_ws2811_modes.py' -v
          python -m unittest discover -s firmware/cybercity/tools -p 'test_runtime_health_wiring.py' -v

  windows_guided_installer:
    name: Windows guided installer self-test (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows installer scripts
        shell: powershell
        run: |
          $path = (Resolve-Path 'firmware/cybercity/tools/Install-CyberCity-ESP32.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Verify complete firmware inventory and Python config escaping
        shell: powershell
        run: |
          & 'firmware/cybercity/tools/Install-CyberCity-ESP32.ps1' -SelfTest -FirmwareDirectory 'firmware/cybercity/esp32'
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer self-test failed' }
