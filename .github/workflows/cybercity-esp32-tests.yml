name: Cyber City ESP32 firmware tests
on:
  pull_request:
    paths:
      - 'firmware/cybercity/esp32/**'
      - 'firmware/cybercity/tools/**'
      - 'app/cybercity_firmware_bundle.py'
      - '.github/workflows/cybercity-esp32-tests.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/cybercity/esp32/**'
      - 'firmware/cybercity/tools/**'
      - 'app/cybercity_firmware_bundle.py'
      - '.github/workflows/cybercity-esp32-tests.yml'
jobs:
  host_regressions:
    name: ESP32 host-side HTTPS and USB installer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check firmware Python syntax
        run: |
          python -m py_compile firmware/cybercity/esp32/labtech_https.py firmware/cybercity/tools/usb_install.py firmware/cybercity/tools/test_labtech_https.py firmware/cybercity/tools/test_usb_install.py app/cybercity_firmware_bundle.py
      - name: Test HTTPS transport and USB installation plan
        run: |
          python -m unittest discover -s firmware/cybercity/tools -p 'test_labtech_https.py' -v
          python -m unittest discover -s firmware/cybercity/tools -p 'test_usb_install.py' -v
