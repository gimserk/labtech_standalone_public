[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "labtech-health-reference"
version = "1.0.0"
description = "Local-only reference connector for the LabTech plugin protocol"
requires-python = ">=3.12,<3.14"

[tool.setuptools]
py-modules = ["health_connector", "connector"]
